volumes:
  db-data:
  chrisolsen-goweb-mod_cache:
  caddy_data:
  caddy_config:

networks:
  caddy_net:
  app_net:

services:
  app:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    env_file:
        # Ensure that the variables in .env match the same variables in devcontainer.json
        - ../.env
    volumes:
      - ../:/app
      - chrisolsen-goweb-mod_cache:/go/pkg/mod
      
    # Overrides default command so things don't shut down after the process ends.
    # This is intentional for the dev environment, but requires that the CMD is manually run.
    command: sleep infinity

    # Runs app on the same network as the database container, allows "forwardPorts" in devcontainer.json function.
    networks:
      - caddy_net
      - app_net

    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally. 
    # (Adding the "ports" property to this file will not forward from a Codespace.)

  caddy:
    image: caddy:latest
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - "5173:5173"  # app
      - "5432:5432"  # postgres: this port is exposed in dev to allow external DB apps to access it
      - "2019:2019"  # caddy
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - $PWD/.config/Caddyfile.dev:/etc/caddy/Caddyfile
    networks:
      - caddy_net

  db:
    image: postgres:latest
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/postgresql
    ports:
      - "54320:5432"
    env_file:
      # Ensure that the variables in .env match the same variables in devcontainer.json
      - ../.env
    networks:
      - app_net
    environment:
      POSTGRES_PASSWORD: postgres
